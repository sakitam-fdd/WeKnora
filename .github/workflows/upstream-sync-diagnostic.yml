name: Format upstream sync

on:
  push:
    branches:
      - sync/resolve-upstream-20260930

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: sync/merged-upstream-20260930
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: Format restored prompt context code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gofmt -w internal/handler/session/qa.go internal/handler/session/types.go
          if git diff --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git add internal/handler/session/qa.go internal/handler/session/types.go
          git commit -m "style(go): format prompt context integration"
          git push origin HEAD:sync/merged-upstream-20260930
