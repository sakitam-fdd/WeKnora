name: One-shot final app test repair

on:
  push:
    branches:
      - fix/actions-20260915
    paths:
      - .github/workflows/repair-final-app-tests.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/actions-20260915
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Repair merged prompt and embed behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # Keep the fork's stronger separation of retrieved context from the
          # configurable system template, but adopt upstream's stable safety /
          # output policy. This avoids changing the system prefix when an image
          # happens to be retrieved and preserves prompt-cache stability.
          p = Path('internal/application/service/chat_pipeline/common.go')
          s = p.read_text()
          s = s.replace('\t"github.com/Tencent/WeKnora/internal/searchutil"\n', '', 1)
          start = s.index('const retrievedImageOutputRequirement = `')
          end = s.index('// pipelineInfo logs pipeline info level entries.', start)
          s = s[:start] + s[end:]

          prompt_start = s.index('\tsystemPrompt := types.RenderPromptPlaceholders(base, types.PlaceholderValues{')
          prompt_end = s.index('\t// Memory goes at the end of the system prompt', prompt_start)
          prompt = '''\tsystemPrompt := types.RenderPromptPlaceholders(base, types.PlaceholderValues{
          \t\t"query":    chatManage.Query,
          \t\t"language": chatManage.Language,
          \t\t// Retrieved content is added later as a separate user message. Keeping it
          \t\t// out of the system message prevents document instructions from gaining
          \t\t// system-level priority through a configurable prompt template.
          \t\t"contexts": "",
          \t})
          \tsystemPrompt += "\\n\\n" + types.SourceDataBoundaryPrompt + "\\n\\n" + types.SourcedAnswerOutputPrompt
          '''
          s = s[:prompt_start] + prompt + s[prompt_end:]
          p.write_text(s)

          # Web retrievals now carry an explicit trust boundary in the current
          # upstream protocol; update the stale merged assertion accordingly.
          p = Path('internal/application/service/chat_pipeline/references_test.go')
          s = p.read_text()
          old = 'require.Contains(t, messages[1].Content, `<retrieval type="web" mode="search">`)'
          new = 'require.Contains(t, messages[1].Content, `<retrieval type="web" mode="search" trust="untrusted">`)'
          assert old in s, 'stale web retrieval assertion not found'
          p.write_text(s.replace(old, new, 1))

          # Merge upstream's embed-specific frame policy with the fork's
          # dedicated embed.html existence/cache handling. The previous merge
          # left two /embed/* branches, making the second one unreachable.
          p = Path('internal/router/static.go')
          s = p.read_text()
          duplicate = '''\t\tif strings.HasPrefix(path, "/embed/") {
          \t\t\tif !hasEmbedIndex {
          \t\t\t\tc.Status(http.StatusNotFound)
          \t\t\t\tc.Abort()
          \t\t\t\treturn
          \t\t\t}
          \t\t\tsetFrontendCacheHeaders(c.Writer, "/embed.html")
          \t\t\tc.File(embedIndexPath)
          \t\t\tc.Abort()
          \t\t\treturn
          \t\t}
          '''
          assert s.count(duplicate) == 1, 'expected one legacy embed block'
          s = s.replace(duplicate, '', 1)

          old = '''\t\t// Embed pages need the dedicated entry point and the channel CSP set by
          \t\t// embedFrameAncestorsMiddleware. Keep the main SPA same-origin only.
          \t\tif strings.HasPrefix(path, "/embed/") {
          \t\t\tc.File(filepath.Join(absDir, "embed.html"))
          \t\t\tc.Abort()
          \t\t\treturn
          \t\t}
          '''
          new = '''\t\t// Embed pages need the dedicated entry point and the channel CSP set by
          \t\t// embedFrameAncestorsMiddleware. Keep the main SPA same-origin only.
          \t\tif strings.HasPrefix(path, "/embed/") {
          \t\t\tif !hasEmbedIndex {
          \t\t\t\tc.Status(http.StatusNotFound)
          \t\t\t\tc.Abort()
          \t\t\t\treturn
          \t\t\t}
          \t\t\tsetFrontendCacheHeaders(c.Writer, "/embed.html")
          \t\t\tc.File(embedIndexPath)
          \t\t\tc.Abort()
          \t\t\treturn
          \t\t}
          '''
          assert old in s, 'upstream embed branch not found'
          p.write_text(s.replace(old, new, 1))
          PY

          gofmt -w \
            internal/application/service/chat_pipeline/common.go \
            internal/application/service/chat_pipeline/references_test.go \
            internal/router/static.go

      - name: Verify affected packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/application/service/chat_pipeline ./internal/router

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/application/service/chat_pipeline/common.go \
            internal/application/service/chat_pipeline/references_test.go \
            internal/router/static.go
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: reconcile prompt and embed merge behavior"
            git push origin HEAD:fix/actions-20260915
          fi
