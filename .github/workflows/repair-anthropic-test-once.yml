name: One-shot Anthropic test repair

on:
  push:
    branches:
      - fix/actions-20260915
    paths:
      - .github/workflows/repair-anthropic-test-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/actions-20260915
          fetch-depth: 0

      - name: Remove obsolete pre-upstream compatibility test
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('internal/models/chat/anthropic_test.go')
          s = p.read_text()
          start = s.find('func TestAnthropicBuildRequestMergesConsecutiveMessageRoles(')
          if start >= 0:
              end = s.find('func TestAnthropicChat_CacheUsage(', start)
              assert end > start
              s = s[:start] + s[end:]
              p.write_text(s)
          PY
          gofmt -w internal/models/chat/anthropic_test.go

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/models/chat/anthropic_test.go
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "test: drop obsolete Anthropic role-merging assertion"
            git push origin HEAD:fix/actions-20260915
          fi
