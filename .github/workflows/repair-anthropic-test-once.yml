name: One-shot final Go test repair

on:
  push:
    branches:
      - fix/actions-20260915
    paths:
      - .github/workflows/repair-anthropic-test-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/actions-20260915
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"

      - name: Repair stale merged tests
        shell: bash
        run: |
          set -euo pipefail
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/Tencent/WeKnora.git
          git fetch --no-tags upstream 90e3977714a08e25ccd4506e317fa9c062c9c372

          git show 90e3977714a08e25ccd4506e317fa9c062c9c372:internal/agent/tools/knowledge_search_rerank_test.go \
            > internal/agent/tools/knowledge_search_rerank_test.go

          python3 <<'PY'
          from pathlib import Path

          p = Path('internal/application/service/tenant_skill_install_test.go')
          s = p.read_text()
          old = '''func (s *installSessionService) SearchKnowledge(
          \tcontext.Context, []string, []string, []types.TagScope, string,
          ) ([]*types.SearchResult, error) {
          \treturn nil, nil
          }'''
          new = '''func (s *installSessionService) SearchKnowledge(
          \tcontext.Context, []string, []string, []types.TagScope, string, string,
          ) ([]*types.SearchResult, error) {
          \treturn nil, nil
          }'''
          assert old in s, 'installSessionService.SearchKnowledge old signature not found'
          p.write_text(s.replace(old, new, 1))
          PY

          gofmt -w \
            internal/agent/tools/knowledge_search_rerank_test.go \
            internal/application/service/tenant_skill_install_test.go

      - name: Verify targeted packages
        shell: bash
        run: |
          set -euo pipefail
          go test ./internal/agent/tools ./internal/application/service

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/agent/tools/knowledge_search_rerank_test.go \
            internal/application/service/tenant_skill_install_test.go
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "test: align merged stubs with current interfaces"
            git push origin HEAD:fix/actions-20260915
          fi
