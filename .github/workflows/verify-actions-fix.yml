name: Verify upstream sync repair

on:
  push:
    branches:
      - fix/actions-20260915
    paths:
      - "frontend/**"
      - "internal/**"
      - "packages/dsh-weknora/**"
      - ".github/workflows/verify-actions-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-upstream-sync-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Verify dsh Go contracts
        run: go test ./packages/dsh-weknora/contract/...

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run type-check
          npm run build

      - name: Verify frontend Docker image
        run: |
          docker build \
            -f frontend/Dockerfile \
            --build-arg VITE_FRONTEND_COMMIT="${GITHUB_SHA::7}" \
            -t weknora-ui:ci \
            frontend/
