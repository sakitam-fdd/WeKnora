name: Go Lint

# The repository carries a large backlog of pre-existing golangci-lint findings,
# so pull requests are only judged on the code they introduce. Do this from the
# local git history instead of golangci-lint-action's `only-new-issues` helper:
# that helper downloads the PR as one GitHub diff and fails for PRs with more
# than 300 changed files (common for upstream-sync PRs).
#
# A large upstream-sync PR is a special case: the old fork base makes every
# imported upstream commit look "new", including upstream's accepted lint
# backlog. When a >300-file PR contains a first-parent merge, use the first such
# merge as the lint baseline. Normal PRs continue to use the PR base SHA.

on:
  pull_request:
    paths:
      - "**/*.go"
      - "**/go.mod"
      - "**/go.sum"
      - ".golangci.yml"
      - ".github/workflows/go-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  GOPROXY: https://proxy.golang.org,direct

jobs:
  # Path filters above start this workflow for any Go change; the matrix still
  # used to lint all three modules. Detect which modules the PR actually
  # touches so a root-only change (migrations test, handler, …) does not queue
  # cli/ and client/ runners. Changing .golangci.yml or this workflow still
  # lints every module, since they share the root config.
  changes:
    name: detect lint modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      lint_base: ${{ steps.detect.outputs.lint_base }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed modules
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          diff_range="${base}...${head}"

          # GitHub's single PR-diff endpoint is capped at 300 files. For a
          # large upstream merge, imported upstream code is baseline rather
          # than fork-authored code, so start linting from that merge commit.
          lint_base="$base"
          changed_count=$(git diff --name-only --diff-filter=ACMR "$diff_range" | wc -l | tr -d '[:space:]')
          if [ "$changed_count" -gt 300 ]; then
            sync_merge=$(git rev-list --reverse --first-parent --merges "${base}..${head}" | head -n 1 || true)
            if [ -n "$sync_merge" ]; then
              lint_base="$sync_merge"
              echo "Large merge PR (${changed_count} files); lint baseline: ${lint_base}"
            fi
          fi
          echo "lint_base=${lint_base}" >> "$GITHUB_OUTPUT"

          modules=()
          if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
               .golangci.yml .github/workflows/go-lint.yml | grep -q .; then
            modules=("." "cli" "client")
          else
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- \
                 '*.go' ':!cli/**' ':!client/**' go.mod go.sum | grep -q .; then
              modules+=(".")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'cli/**' | grep -q .; then
              modules+=("cli")
            fi
            if git diff --name-only --diff-filter=ACMR "$diff_range" -- 'client/**' | grep -q .; then
              modules+=("client")
            fi
          fi
          json="["
          first=1
          for m in "${modules[@]}"; do
            if [ "$first" -eq 1 ]; then
              first=0
            else
              json+=","
            fi
            json+="\"${m}\""
          done
          json+="]"
          echo "modules=${json}" >> "$GITHUB_OUTPUT"
          echo "Lint modules: ${json}"

  golangci:
    name: golangci-lint (${{ matrix.module }})
    needs: changes
    if: needs.changes.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.modules) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: ${{ matrix.module }}
          args: --new-from-rev=${{ needs.changes.outputs.lint_base }}
