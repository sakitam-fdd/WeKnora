name: One-shot action repair runner

on:
  push:
    branches:
      - fix/actions-20260915
    paths:
      - .github/workflows/repair-actions-runner.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/actions-20260915
          fetch-depth: 0

      - name: Apply merge repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/repair-actions-once.yml').read_text()
          body = workflow.split("python3 <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(body), 'repair-actions-once.yml', 'exec'))
          PY
          gofmt -w internal/config/config.go internal/models/chat/anthropic.go

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Verify dsh Go contracts
        run: go test ./packages/dsh-weknora/contract/...

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run type-check
          npm run build

      - name: Commit repaired code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/config/config.go internal/models/chat/anthropic.go \
            frontend/src/views/knowledge/KnowledgeBase.vue frontend/src/i18n/locales/ja-JP.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "fix: repair upstream sync conflicts and CI failures"
          git push origin HEAD:fix/actions-20260915
