name: One-shot action repair

on:
  push:
    branches:
      - fix/actions-20260915
    paths:
      - .github/workflows/repair-actions-once.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "24"
  GO_VERSION: "1.25.1"

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/actions-20260915
          fetch-depth: 0

      - name: Apply merge repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          # 1) Preserve fork login throttling while restoring the upstream password policy field.
          p = Path('internal/config/config.go')
          s = p.read_text()
          if 'ComplexPasswordEnabled bool' not in s:
              marker = '\t// LoginRateLimitMax is the maximum number of password-login requests that\n'
              assert marker in s
              s = s.replace(marker, '\tComplexPasswordEnabled bool `yaml:"complex_password_enabled" json:"complex_password_enabled"`\n' + marker, 1)
          p.write_text(s)

          # 2) Restore current upstream Anthropic request assembly (tool calls + cache control).
          p = Path('internal/models/chat/anthropic.go')
          s = p.read_text()
          start = s.index('func (c *AnthropicChat) buildRequest(')
          end = s.index('func textFromMultiContent(', start)
          replacement = r'''func (c *AnthropicChat) buildRequest(_ context.Context, messages []Message, opts *ChatOptions) anthropicRequest {
          req := anthropicRequest{
              Model:     c.modelName,
              MaxTokens: 1024,
              Messages:  make([]anthropicMessage, 0, len(messages)),
          }
          if opts != nil {
              if budget := opts.CompletionBudget(); budget > 0 {
                  req.MaxTokens = budget
              }
              if opts.Temperature > 0 {
                  temperature := opts.Temperature
                  req.Temperature = &temperature
              }
              if opts.TopP > 0 {
                  topP := opts.TopP
                  req.TopP = &topP
              }
          }

          anthropicToolOptions(&req, opts)
          systemParts, converted := anthropicMessages(messages)
          req.Messages = converted

          systemText := strings.Join(systemParts, "\n\n")
          retention := resolveCacheRetention(opts)
          marker := cacheControlFor(retention, "1h")
          if marker == nil {
              req.System = systemText
              return req
          }
          if systemText != "" {
              req.System = []anthropicContentBlock{{
                  Type:         "text",
                  Text:         systemText,
                  CacheControl: &anthropicCacheControl{Type: marker.Type, TTL: marker.TTL},
              }}
          }
          if len(req.Messages) > 0 {
              last := &req.Messages[len(req.Messages)-1]
              if text, ok := last.Content.(string); ok && text != "" {
                  last.Content = []anthropicContentBlock{{
                      Type:         "text",
                      Text:         text,
                      CacheControl: &anthropicCacheControl{Type: marker.Type, TTL: marker.TTL},
                  }}
              }
          }
          return req
          }

          '''
          s = s[:start] + replacement + s[end:]
          p.write_text(s)

          # 3) Replace the malformed duplicate batch-delete merge hunk with upstream's coherent deletion lifecycle.
          p = Path('frontend/src/views/knowledge/KnowledgeBase.vue')
          s = p.read_text()
          broken = s.find('const confirmBatchDelete = async () => {')
          stable = s.find('const confirmBatchDelete = () => {', broken + 1) if broken >= 0 else -1
          if broken >= 0:
              assert stable > broken
              replacement = r'''// Stop observing a previous KB when navigating, including away and back.
          let deleteGeneration = 0;
          watch(kbId, () => {
            deleteGeneration++;
            batchDeleting.value = false;
          });
          onUnmounted(() => { deleteGeneration++; });

          const deleteKnowledgeDocuments = async (
            ids: string[],
            submit: () => Promise<any>,
            batch: boolean,
          ) => {
            if (batchDeleting.value || batchReparsing.value || ids.length === 0) return;
            const targetKbId = kbId.value;
            const generation = ++deleteGeneration;
            const isActive = () => generation === deleteGeneration && isCurrentKb(targetKbId);
            batchDeleting.value = true;
            let submitted = false;
            try {
              const res = await submit();
              if (!isActive()) return;
              if (!res?.success) {
                MessagePlugin.error(res?.message || t('knowledgeBase.batchDeleteFailed'));
                return;
              }
              submitted = true;
              MessagePlugin.info(t('knowledgeBase.deleteSubmitted'));
              if (batch) {
                clearSelection();
                batchMode.value = false;
              }
              const result = await waitForKnowledgeDeletion(
                ids,
                async (queryIds) => {
                  const query = new URLSearchParams();
                  queryIds.forEach(id => query.append('ids', id));
                  return await batchQueryKnowledge(query.toString(), targetKbId) as any;
                },
                { isActive },
              );
              if (!isActive() || result === 'cancelled') return;
              if (result === 'completed') {
                MessagePlugin.success(batch
                  ? t('knowledgeBase.batchDeleteSuccess', { count: ids.length })
                  : t('knowledgeBase.deleteSuccess'));
              } else if (result === 'failed') {
                MessagePlugin.error(t('knowledgeBase.deleteTaskFailed'));
              } else {
                MessagePlugin.info(t('knowledgeBase.deletePending'));
              }
            } catch (e: any) {
              if (!isActive()) return;
              if (submitted) {
                MessagePlugin.warning(t('knowledgeBase.deleteStatusUnavailable'));
              } else {
                MessagePlugin.error(e?.message || t('knowledgeBase.batchDeleteFailed'));
              }
            } finally {
              if (isActive()) {
                batchDeleting.value = false;
                if (submitted) {
                  resetPage();
                  await loadKnowledgeFiles(targetKbId);
                  if (isActive()) {
                    void loadTags(targetKbId, true);
                    void loadFolderTree(targetKbId);
                  }
                }
              }
            }
          };

          '''
              s = s[:broken] + replacement + s[stable:]
          assert s.count('const confirmBatchDelete =') == 1
          assert 'const deleteKnowledgeDocuments = async (' in s
          p.write_text(s)

          # 4) Complete ja-JP locale parity for fork/upstream keys.
          p = Path('frontend/src/i18n/locales/ja-JP.ts')
          s = p.read_text()
          if 'loginRateLimited:' not in s:
              needle = "    loginErrorRetry: 'ログインに失敗しました。しばらくしてから再試行してください',\n"
              assert needle in s
              s = s.replace(needle, needle +
                  "    loginRateLimited: 'ログイン試行回数が多すぎます。{seconds}秒後に再試行してください。',\n"
                  "    loginRetryCountdown: '{seconds}秒後に再試行',\n", 1)
          if 'batchDeletePartial:' not in s:
              needle = "    batchDeleteFailed: '一括削除に失敗しました',\n"
              assert needle in s
              s = s.replace(needle, needle + "    batchDeletePartial: '{succeeded}件のドキュメントを削除し、{failed}件は失敗しました',\n", 1)
          if 'batchReparsePartial:' not in s:
              needle = "    batchReparseFailed: '一括再構築に失敗しました',\n"
              assert needle in s
              s = s.replace(needle, needle + "    batchReparsePartial: '{succeeded}件の再構築タスクを登録し、{failed}件は失敗しました',\n", 1)
          if 'MULTIMODAL_OCR_REQUIRED:' not in s:
              needle = "    errorCode: {\n"
              assert needle in s
              s = s.replace(needle, needle +
                  "      MULTIMODAL_OCR_REQUIRED: 'スキャンPDFにはOCRが必要です',\n"
                  "      MULTIMODAL_OCR_REQUIRED_SUGGESTION: '使用可能なテキストを抽出できませんでした。マルチモーダル処理を有効にしてVLM/OCRモデルを設定し、ドキュメントを再解析してください。',\n", 1)
          p.write_text(s)
          PY
          gofmt -w internal/config/config.go internal/models/chat/anthropic.go

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify dsh Go contracts
        run: go test ./packages/dsh-weknora/contract/...

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run type-check
          npm run build

      - name: Commit repaired code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/config/config.go internal/models/chat/anthropic.go \
            frontend/src/views/knowledge/KnowledgeBase.vue frontend/src/i18n/locales/ja-JP.ts
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "fix: repair upstream sync conflicts and CI failures"
          git push origin HEAD:fix/actions-20260915
